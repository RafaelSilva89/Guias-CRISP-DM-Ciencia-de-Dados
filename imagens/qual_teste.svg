   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="411.75" y="40.238047" transform="rotate(-0 411.75 40.238047)">Que tipo de variáveis estou comparando?</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="119.575" y="110.798047" transform="rotate(-0 119.575 110.798047)">duas categóricas</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="411.75" y="110.798047" transform="rotate(-0 411.75 110.798047)">numérica × grupos</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="698.30625" y="110.798047" transform="rotate(-0 698.30625 110.798047)">duas numéricas</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(30.624648 180.537178)">Qui-quadrado</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(28.683594 191.079502)">+ V de Cramér</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(153.493555 180.707178)">Odds ratio</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(148.582813 190.909502)">(tabela 2×2)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(273.775 175.605684)">2 grupos:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(261.963984 185.808008)">Mann-Whitney</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(256.029258 196.010332)">+ corr. de postos</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(385.398008 175.435684)">3+ grupos:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(377.777227 185.638008)">Kruskal-Wallis</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(387.534297 196.180332)">+ épsilon²</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(479.277266 175.606016)">mesma unidade 2×:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(505.206914 185.80834)">Wilcoxon</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(507.215703 196.010664)">pareado</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(601.224453 175.682715)">relação que sobe</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(619.138203 185.885039)">ou desce:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(617.847266 196.086699)">Spearman</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(731.742695 175.606016)">reta e sem</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(737.205273 185.80834)">outliers:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(737.86668 196.01)">Pearson</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #264653" x="209.475" y="271.798242" transform="rotate(-0 209.475 271.798242)">uma proporção contra um valor de referência → Binomial (+ IC)</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #264653" x="614.025" y="271.798242" transform="rotate(-0 614.025 271.798242)">médias de dados quase normais → t de Welch + d de Cohen</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e76f51" x="411.75" y="319.68" transform="rotate(-0 411.75 319.68)">Sempre: teste + tamanho do efeito. Dados assimétricos ou com outliers → prefira os testes de postos.</text>
   </g>
  </g>
 </g>
