   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(526.569231 137.009125)">aproveitar cedo demais:</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(526.569231 147.571531)">pode ficar com o errado</text>
   </g>
   <g id="text_12">
