   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(48.769507 31.991742)">cada braço tem uma chance de pagar</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(73.109585 44.244047)">que o agente NÃO conhece</text>
