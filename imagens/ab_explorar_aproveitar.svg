   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(351.30421 136.770521)">APROVEITAR</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #264653" transform="translate(299.61085 148.173119)">usar o braço que parece melhor</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(526.569231 69.977125)">explorar demais:</text>
