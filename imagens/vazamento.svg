   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="252.72" y="107.283305" transform="rotate(-0 252.72 107.283305)">TESTE</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(96.808359 196.736323)">informação do teste (ou do futuro)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(139.486641 207.538784)">entra no treino:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(95.071641 218.701245)">• escala/média calculada com tudo</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(108.929531 229.863705)">• coluna que é o próprio alvo</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #e76f51" transform="translate(113.944922 240.666166)">• duplicatas nos dois lados</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="431.28" y="107.283305" transform="rotate(-0 431.28 107.283305)">TREINO</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="587.52" y="107.283305" transform="rotate(-0 587.52 107.283305)">TESTE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2a9d8f" transform="translate(461.297812 196.583041)">o teste fica trancado:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2a9d8f" transform="translate(438.805547 207.745502)">• Pipeline ajustado só no treino</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2a9d8f" transform="translate(454.883906 218.907963)">• só colunas disponíveis</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2a9d8f" transform="translate(450.225703 229.863705)">  no momento da previsão</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #2a9d8f" transform="translate(443.460938 241.026166)">• teste aberto uma única vez</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.077969" transform="rotate(-0 7.2 17.077969)">Vazamento de dados: o modelo "cola" na prova</text>
