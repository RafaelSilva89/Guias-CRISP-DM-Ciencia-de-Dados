   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #264653" x="15.26" y="22.10518" transform="rotate(-0 15.26 22.10518)">Qual método de Teste A/B usar? Três perguntas resolvem</text>
